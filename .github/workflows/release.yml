name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Prepare release files
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk" || { echo "::error::Signed APK not found"; exit 1; }
          cp "$apk" "media-widget-${GITHUB_REF_NAME}.apk"
          # Extract the "## [x.y]" section of CHANGELOG.md up to the next "## " heading.
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "Release ${GITHUB_REF_NAME}" > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: media-widget-${{ github.ref_name }}.apk

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
